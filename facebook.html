<html>
<head>
    <title>Facebook Login Page</title>
    <style>
        body
        {
            background-color: rgb(240, 242, 245);
        }
        h1
        {
            color: rgb(24, 119, 242);
            font-family: sans-serif;
            font-size: 65px;
            margin-left: 500px;
            margin-top: 165px;
        }
        p
        {
            font-family: sans-serif;
            font-size: 25px;
            margin-left: 180px;
        }
        form
        {
           
            border: 1px solid rgb(220, 220, 220);
            width: 350px;
            margin-left: 450px;
            margin-top: -40px;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 4px 8px 10px rgb(17, 16, 16);
            
        }
        input
        {
            box-sizing: border-box;
            border: 1px solid rgb(200, 200, 200);
            border-radius: 7px;
            height: 45px;
            padding-left: 10px;
        }
        #i1, #i2
        {
            width: 350px;
        }
        #i3
        {
            width: 350px;
            height: 40px;
            background-color: rgb(24, 119, 242);
            color: white;
            border: none;
            border-radius: 7px;
        }
        #i4
        {
            color: rgb(24, 119, 242);
            text-decoration: none;
            margin-left: 110px;
        }
        #i5
        {
            width: 180px;
            height: 40px;
            margin-left: 85px;
            background-color: rgb(66, 183, 42);
            color: white;
            border: none;
            border-radius: 7px;
        }
    </style>
</head>
<body>
    <h1>facebook</h1>
    <form>
        <input type="text" id="i1" placeholder="Email address or phone number"><br><br>
        <input type="password" id="i2" placeholder="Password"><br><br>
        <button id="i3">Log In</button><br><br>
        <a href="#" id="i4">Forgotten password?</a>
        <br><br>
        <button id="i5">Create new account</button>
    </form>
</body>
</html>
