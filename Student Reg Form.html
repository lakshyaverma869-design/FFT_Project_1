<html>
<head>
    <title>Student Registration Form</title>
    <style>
        form
        {
            border: 1px solid black;
            width: 500px;
            margin-left: 500px;
            margin-top: 40px;
            padding-left: 40px;
            padding-bottom: 50px;
            background-color:rgb(219, 234, 254);
            border-radius: 30px;
            box-shadow: 4px 8px 10px rgb(100, 116, 139);
        }
        h1 
        {
            text-align: center;
        }
        label 
        {
            
            width: 120px;
            text-align: left;
            margin-right: 10px;
            padding-left: 7px;
        }

        input 
        {
            box-sizing: border-box;
            border: none;
        }
        button 
        {
            width: 100px;
            margin-left: 134px;
        }
        #i1
        {
            width: 200px;
            margin-left: 20px;
            height: 30px;
        }
        #i2
        {
            width: 200px;
            margin-left: 25px;
            height: 30px;
        }
        #i3
        {
            margin-left: 30px;
        }
        #i4
        {
            width: 200px;
            margin-left: 25px;
            height: 30px;
        }
        #i5
        {
            width: 200px;
            margin-left: -7px;
            height: 30px;
        }
        #i6
        {
            width: 200px;
            margin-left: 14px;
            height: 30px;
        }
        #i7
        {
            width: 200px;
            margin-left: -12px;
            height: 30px;
        }

            width: 200px;
            margin-left: 17px;

        }
        #i13
        {
            margin-left: 30px;

            height: 30px;

        }

<body>
      <form>
        <h1>Student Registration Form</h1>

        <label>Reg Id:</label>
        <input type="number" id="i1" required placeholder="Enter your reg ID"><br><br>

        <label>Name:</label>
        <input type="text" id="i2" placeholder="Enter your Name"><br><br>

        <input type="date" id="i3"><br><br>

        <input type="number" id="i5" placeholder="Enter Mob Number"><br><br>

        <label>College:</label>
        <input type="text" id="i6" placeholder="Enter College Name"><br><br>

        <label>Department:</label>
        <input type="text" id="i7"><br><br>

        <label>Course:</label>
        <input type="text" id="i8"><br><br>

        <input type="text" id="i9"><br><br>

        <button id="i13">Reset</button>
      </form>
