<html>

<head>
    <title>Student Registration Form</title>
    <style>
        h1 {
            text-align: center;
  
        }
        label 
        {
            display: inline-block;
            width: 120px;
            text-align: right;
            margin-right: 10px;
        }

        input 
        {
            width: 200px;
            box-sizing: border-box;
        }
        button 
        {
             width: 100px;
            margin-left: 134px;
        }

    </style>
</head>
<body>
      <form>
        <h1>Student Registration Form</h1>

        <label>Reg Id:</label>
        <input type="number" ><br><br>

        <label>Name:</label>
        <input type="text"><br><br>

        <label>Gender:</label>
        <input type="text"><br><br>

        <label>DOB:</label>
        <input type="date"><br><br>

        <Label>Email:</label>
        <input type="email"><br><br>

        <label>Mobile No:</label>
        <input type="number"><br><br>

        <label>College:</label>
        <input type="text"><br><br>

        <label>Department:</label>
        <input type="text"><br><br>

        <label>Course:</label>
        <input type="text"><br><br>

        <label>Section:</label>
        <input type="text"><br><br>

        <label>Address:</label>
        <input type="text"><br><br>

        <label>resume:</label>
        <input type="file"><br><br>

        <button>Submit</button>
        <button>Reset</button>
      </form>
</body>
</html>
