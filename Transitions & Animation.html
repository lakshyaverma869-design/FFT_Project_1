<html>
    <head>
        <title>Transition & Animation</title>
        <style>
        button
        {
            margin-left: 740px;
            margin-bottom: 20px;
            width: 100px;
            height: 50px;
            border: none;
            background-color: red;
            border-radius: 15px;
            transition: 2s;
        }
        button:hover
        {
            background-color: pink;
            transform: scale(1.5);
        }
        h1
        {
            text-align: center;
        }
        .section
        {
            display: grid;
            grid-template-columns: 250px 250px;
            gap: 30px;
            justify-content: center;
        } 
        .animation
        {
            width: 250px;
            height: 250px;
            border: 2px solid black;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        .box
        {
            width: 100px;
            height: 100px;
            background: red;
            animation: Lakshya 4s ease alternate  infinite;
        }
        @keyframes Lakshya {
            to{
                transform: scale(0);
            }
            from{
                transform: scale(360px);
            }
        }
        .load1
        {
            width: 100px;
            height: 100px;
            border: 10px solid lightgray;
            border-top: 10px solid rgb(84, 18, 184);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin
        {
            from
            {
                transform: rotate(0deg);
            }
            to
            {
                transform: rotate(360deg);
            }
        } 
        .load2
        {
            width: 100px;
            height: 100px;
            background: transparent;
            border: 5px solid blue;
            animation: move 2s linear infinite;
        }  
        @keyframes move
        {
            from
            {
                transform: rotate(0deg);
            }
            to
            {
                transform: rotate(-360deg);
            }
        }
        .load3
        {
            width: 100px;
            height: 100px;
            background: green;
            animation: rotate 3s linear infinite;
        }   
        @keyframes rotate
        {
            from
            {
                transform: rotate(0deg);
            }
            to
            {
                transform: rotate(360deg);
            }
        }
        </style>
    </head>
    <body>
        <h1>Transition & Animation</h1>
        <button>Action</button>
        <div class="section">
        <div class="animation">
            <div class="box"></div>
        </div>
        <div class="animation">
            <div class="load1"></div>
        </div>
        <div class="animation">
            <div class="load2"></div>
        </div>
        <div class="animation">
            <div class="load3"></div>
        </div>
        </div>  
    </body>
</html>
